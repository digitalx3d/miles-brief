<title>Morning Brief</title>
<style>
:root {
  --bg: #ddd4c5;
  --bg-card: #beaf9d;
  --text-primary: #645d54;
  --text-secondary: #69655d;
  --accent-weather: #fee381;
  --accent-email: #3dfff2;
  --accent-calendar: #4476ab;
  --accent-note: #a05a6a;
  --border-subtle: rgba(0,0,0,0.08);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
  --font-display: 'Libre Baskerville', Georgia, serif;
  --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 540px; margin: 0 auto; }
.header { text-align: center; padding: 36px 0 6px; }
.header h1 { font-family: var(--font-display); font-size: 2.2em; font-weight: 400; color: var(--text-primary); letter-spacing: 0.3px; }
.header .date { font-size: 1.3em; color: var(--text-secondary); opacity: 0.7; margin-top: 8px; }
.header .divider { width: 48px; height: 2px; background: linear-gradient(90deg, var(--accent-weather), var(--accent-calendar)); margin: 18px auto 0; border-radius: 1px; opacity: 0.7; }
.greeting { text-align: center; font-size: 1.34em; line-height: 1.3; color: var(--text-secondary); padding: 22px 8px 28px; font-style: italic; }
.cards { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--bg-card); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; border-radius: 14px 14px 0 0; }
.card.weather::before { background: linear-gradient(90deg, var(--accent-weather), transparent); }
.card.email::before { background: linear-gradient(90deg, var(--accent-email), transparent); }
.card.calendar::before { background: linear-gradient(90deg, var(--accent-calendar), transparent); }
.card.note::before { background: linear-gradient(90deg, var(--accent-note), transparent); }
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-icon { font-size: 1.2em; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
.card h2 { font-family: var(--font-display); font-size: 1.5em; font-weight: 400; letter-spacing: 0.3px; }
.card.weather h2 { color: var(--accent-weather); }
.card.email h2 { color: var(--accent-email); }
.card.calendar h2 { color: var(--accent-calendar); }
.card.note h2 { color: var(--accent-note); }
.card p, .card li { font-size: 1.38em; line-height: 1.3; color: var(--text-secondary); }
.card p strong, .card li strong { color: var(--text-primary); font-weight: 600; }
.card ul { list-style: none; padding: 0; }
.card ul li { padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
.card ul li:last-child { border-bottom: none; padding-bottom: 0; }
.signoff { text-align: center; font-size: 1.35em; line-height: 1.3; color: var(--text-secondary); opacity: 0.7; padding: 28px 12px 16px; }
.footer { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 0 32px; }
